<div class="container-fluid">

 <div class="row m-2 align-items-center">
   <div class="col-auto ms-auto btn-group align-items-center">
        <button type="button" onclick="Redirect('/io/phidget')" class="btn btn-outline-secondary"><i class="fas fa-list"></i> Retour à la liste</button>
        <button type="button" onclick="PHIDGET_Refresh()" class="btn btn-outline-secondary"><i class="fas fa-redo"></i> Refresh</button>
   </div>
 </div>

<hr>

<div>
    <table id="idTablePHIDGET_IO" class="table table-striped table-bordered table-hover w-100">
      <thead class="table-dark">
      </thead>
      <tbody>
      </tbody>
    </table>
</div>

<!-- Container -->
</div>

<!------------------------------------------------- Modal Edit Analog Input --------------------------------------------------->
<div id="idPHIDGETEditIO" class="modal fade" tabindex="-1" role="dialog">
  <div class="modal-dialog modal-dialog-centered modal-lg" role="document">
    <div class="modal-content ">
      <div class="modal-header bg-info text-white">
        <h5 class="modal-title"><i class="fas fa-pen"></i> <span id="idPHIDGETEditIOTitre"></span></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close">
        </button>
      </div>
      <div class="modal-body">

       <div class="row mb-2 align-items-center">
         <label class="col-5 col-sm-4 col-form-label text-end">Type de Capteur</label>
         <div class="col-7 col-sm-8">
          <select id="idPHIDGETEditIOCapteur" class="form-select border-info"></select>
         </div>
       </div>

       <div class="row mb-2 align-items-center">
         <label class="col-5 col-sm-4 col-form-label text-end">Archivage</label>
         <div class="col-7 col-sm-8">
          <select id="idPHIDGETEditIOArchivage" class="form-select border-info">
          </select>
         </div>
       </div>

       <div class="row mb-2 align-items-center">
         <label class="col-5 col-sm-4 col-form-label text-end">Intervalle</label>
         <div class="col-7 col-sm-8">
          <div class="input-group">
          <input id="idPHIDGETEditIOIntervalle" required type="number" class="form-control" min=1000 max=60000 placeholder="Intervalle d'acquisition">
          <span class="input-group-text">ms</span>
          </div>
         </div>
        </div>

       <div class="row mb-2 align-items-center">
         <label class="col-5 col-sm-4 col-form-label text-end">Description</label>
         <div class="col-7 col-sm-8">
          <input id="idPHIDGETEditIOLibelle" type="text" class="form-control" placeholder="Description">
         </div>
       </div>

       <div class="row mb-2 align-items-center">
         <label class="col-5 col-sm-4 col-form-label text-end">Unité</label>
         <div class="col-7 col-sm-8">
          <input id="idPHIDGETEditIOUnite" type="text" class="form-control" placeholder="Unité (ex: °C, %, bar)">
         </div>
       </div>

      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"><i class="fas fa-times"></i> Annuler</button>
        <button id="idPHIDGETEditIOValider" type="button" class="btn btn-primary"><i class="fas fa-save"></i> Valider</button>
      </div>
    </div>
  </div>
</div>
