 <div class="row m-2">
   <div class="col-auto ms-auto btn-group align-items-center">
        <button type="button" onclick="UPS_Add()" class="btn btn-primary"><i class="fas fa-plus"></i> Ajouter un agent</button>
        <button type="button" onclick="UPS_Refresh()" class="btn btn-outline-secondary"><i class="fas fa-redo"></i> Refresh</button>
   </div>
 </div>

     <table id="idTableUPS" class="table table-striped table-bordered table-hover">
       <thead class="table-dark">
       </thead>
       <tbody>
       </tbody>
     </table>

<!-- Container -->
</div>

<!------------------------------------------------- Modal Edition configuration ----------------------------------------------->
<div id="idUPSEdit" class="modal fade" tabindex="-1" role="dialog">
  <div class="modal-dialog modal-dialog-centered modal-lg" role="document">
    <div class="modal-content ">
      <div class="modal-header bg-info text-white">
        <h5 class="modal-title text-justify"><i class="fas fa-pen"></i> <span id="idUPSTitre"></span></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close">
        </button>
      </div>

      <div class="modal-body">

       <div class="row mb-2 align-items-center">
         <label class="col-5 col-sm-4 col-form-label text-end">Serveur de l'agent</label>
         <div class="col-7 col-sm-8">
           <select id="idTargetServer" class="form-select border-info"></select>
         </div>
       </div>

       <div class="row mb-2 align-items-center">
         <label class="col-5 col-sm-4 col-form-label text-end">Tech_ID</label>
         <div class="col-7 col-sm-8">
           <input id="idUPSTechID" type="text" class="form-control" maxlength="32" placeholder="Tech_ID de l'agent UPS">
         </div>
       </div>

       <div class="row mb-2 align-items-center">
         <label class="col-5 col-sm-4 col-form-label text-end">Description</label>
         <div class="col-7 col-sm-8">
           <input id="idUPSDescription" type="text" class="form-control" placeholder="Description de l'onduleur">
         </div>
       </div>

       <div class="row mb-2 align-items-center">
         <label class="col-5 col-sm-4 col-form-label text-end">Nom de l'onduleur</label>
         <div class="col-7 col-sm-8">
           <input id="idUPSName" required type="text" class="form-control" maxlength="32" placeholder="Nom de l'onduleur dans NUT">
         </div>
       </div>

       <div class="row mb-2 align-items-center">
         <label class="col-5 col-sm-4 col-form-label text-end">Host</label>
         <div class="col-7 col-sm-8">
           <input id="idUPSHost" required type="text" class="form-control" maxlength="32" placeholder="Adresse du serveur NUT">
         </div>
       </div>

       <div class="row mb-2 align-items-center">
         <label class="col-5 col-sm-4 col-form-label text-end">Admin Username</label>
         <div class="col-7 col-sm-8">
           <input id="idUPSAdminUsername" type="text" class="form-control" maxlength="32" placeholder="Utilisateur d'administration">
         </div>
       </div>

       <div class="row mb-2 align-items-center">
         <label class="col-5 col-sm-4 col-form-label text-end">Admin Password</label>
         <div class="col-7 col-sm-8">
           <input id="idUPSAdminPassword" type="password" class="form-control" maxlength="32" placeholder="Mot de passe d'administration">
         </div>
       </div>

      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"><i class="fas fa-times"></i> Annuler</button>
        <button id="idUPSValider" type="button" class="btn btn-primary"><i class="fas fa-save"></i> Valider</button>
      </div>
    </div>
  </div>
</div>
