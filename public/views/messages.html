<div class="container-fluid">

<hr>

  <table id="idTableMESSAGES" class="table table-striped table-bordered table-hover">
    <thead class="table-dark">
				</thead>
			 <tbody>
    </tbody>
  </table>


<!-- Container -->
</div>


<div id="idMSGEdit" class="modal fade" tabindex="-1" role="dialog">
  <div class="modal-dialog modal-dialog-centered modal-lg" role="document">
    <div class="modal-content ">
      <div class="modal-header bg-info text-white">
        <h5 class="modal-title text-justify"><i class="fas fa-pen"></i> <span id="idMSGEditTitre"></span></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close">
        </button>
      </div>
      <div class="modal-body">

       <div class="row mb-2 align-items-center">
         <label class="col-5 col-sm-4 col-form-label text-end">Libellé</label>
         <div class="col-7 col-sm-8">
           <input id="idMSGEditLibelle" type="text" class="form-control" disabled placeholder="Libellé du Message">
         </div>
       </div>

       <div class="row mb-2 align-items-center">
         <label class="col-5 col-sm-4 col-form-label text-end">Zone de Diffusion Sonore</label>
         <div class="col-7 col-sm-8">
           <select id="idMSGEditAudioZone" class="form-select border-info"></select>
         </div>
       </div>

       <div class="row mb-2 align-items-center">
         <label class="col-5 col-sm-4 col-form-label text-end">Libellé audio</label>
         <div class="col-7 col-sm-8">
           <input id="idMSGEditAudioLibelle" type="text" class="form-control" placeholder="Libellé audio du Message">
         </div>
       </div>

       <div class="row mb-2 align-items-center">
         <label class="col-5 col-sm-4 col-form-label text-end">Notification GSM</label>
         <div class="col-7 col-sm-8">
           <select id="idMSGEditNotifSMSG" class="form-select border-info"></select>
         </div>
       </div>

       <div class="row mb-2 align-items-center">
         <label class="col-5 col-sm-4 col-form-label text-end">Notification CHAT</label>
         <div class="col-7 col-sm-8">
           <select id="idMSGEditNotifIMSG" class="form-select border-info"></select>
         </div>
       </div>

       <div class="row mb-2 align-items-center">
         <label class="col-5 col-sm-4 col-form-label text-end">Rate limit</label>
         <div class="col-7 col-sm-8">
           <div class="input-group">
             <input id="idMSGEditRateLimit" type="number" required min=0 max=300 class="form-control" placeholder="seconde entre 2 messages">
             <div class="input-group-text">secondes</div>
           </div>
         </div>
       </div>

      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"><i class="fas fa-times"></i> Annuler</button>
        <button id="idMSGEditValider" type="button" class="btn btn-primary" data-bs-dismiss="modal"><i class="fas fa-save"></i> Valider</button>
      </div>
    </div>
  </div>
</div>
