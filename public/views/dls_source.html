<div class="container-fluid">

 <div class="row m-2 align-items-center">
   <div class="col-auto">
     <h5 class="mb-0">Du synoptique <strong id="idSourceSynoptique"></strong></h5>
   </div>
     <div class ="col-12 col-md-auto ms-md-auto d-flex flex-wrap gap-2 justify-content-end align-items-start">
       <button type="button" onclick="Dls_Compiler()" class="btn btn-outline-success text-nowrap flex-shrink-0"><i class="fas fa-coffee"></i> Compiler</button>
       <button type="button" onclick="Dls_Restart()" class="btn btn-outline-warning text-nowrap flex-shrink-0"><i class="fas fa-redo"></i> Restart</button>
       <button type="button" onclick="Go_to_dls_monitor() "class="btn btn-info text-nowrap flex-shrink-0"><i class="fas fa-binoculars"></i> Monitor</button>
       <button type="button" onclick="Go_to_messages()" class="btn btn-primary text-nowrap flex-shrink-0"><i class="fas fa-book"></i> Messages</button>
       <button type="button" class="btn btn-outline-primary text-nowrap flex-shrink-0" data-bs-toggle="offcanvas" data-bs-target="#idDlsIAPanel" aria-controls="idDlsIAPanel"><i class="fas fa-wand-magic-sparkles"></i> Assistant IA</button>
   </div>
 </div>

<hr>

     <div class="row m-1">
       <div id="idErrorLog" class="col-12 alert alert-info" role="alert">
         <!--<h6 class="text-center">Résultat de compilation</h6>-->
       </div>
     </div>

     <div class="row m-1">
       <div class="col-12 border border-info">
         <textarea id="idSourceCode" rows="10"></textarea>
       </div>
     </div>

<div class="offcanvas offcanvas-end" tabindex="-1" id="idDlsIAPanel" aria-labelledby="idDlsIAPanelTitle" style="--bs-offcanvas-width: min(460px, 100vw)">
  <div class="offcanvas-header border-bottom">
    <h5 class="offcanvas-title" id="idDlsIAPanelTitle">Assistant D.L.S</h5>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Fermer"></button>
  </div>
  <div class="offcanvas-body d-flex flex-column gap-2">
    <div class="alert alert-warning py-2 small mb-0">Le source et votre demande seront envoyés au fournisseur IA configuré pour ce domaine.</div>
    <div class="d-flex flex-wrap gap-1" role="group" aria-label="Actions IA">
      <button type="button" class="btn btn-sm btn-outline-secondary" onclick="Dls_IA_quick_action('explain')">Expliquer</button>
      <button type="button" class="btn btn-sm btn-outline-secondary" onclick="Dls_IA_quick_action('fix')">Corriger les erreurs</button>
      <button type="button" class="btn btn-sm btn-outline-secondary" onclick="Dls_IA_focus_prompt()">Modifier...</button>
    </div>
    <div id="idDlsIAConversation" class="border rounded p-2 flex-grow-1 overflow-auto" aria-live="polite"></div>
    <label class="visually-hidden" for="idDlsIAPrompt">Message</label>
    <textarea id="idDlsIAPrompt" class="form-control" rows="3" maxlength="8192" placeholder="Posez une question ou décrivez la modification souhaitée"></textarea>
    <div class="d-flex justify-content-end">
      <button id="idDlsIASend" type="button" class="btn btn-primary" onclick="Dls_IA_send()"><i class="fas fa-paper-plane"></i> Envoyer</button>
    </div>
  </div>
</div>

<!-- Container -->
</div>
