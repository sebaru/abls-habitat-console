<div class="container-fluid">
 <div class="row m-2">
   <div class="col-auto ms-auto btn-group align-items-center">
     <button type="button" onclick="MODBUS_Add()" class="btn btn-primary"><i class="fas fa-plus"></i> Ajouter un agent</button>
     <button type="button" onclick="MODBUS_Refresh()" class="btn btn-outline-secondary"><i class="fas fa-redo"></i> Refresh</button>
   </div>
 </div>
 <hr>
 <table id="idTableMODBUS" class="table table-striped table-bordered table-hover"><thead class="table-dark"></thead><tbody></tbody></table>
</div>

<div id="idMODBUSEdit" class="modal fade" tabindex="-1" role="dialog">
 <div class="modal-dialog modal-dialog-centered modal-lg" role="document"><div class="modal-content">
  <div class="modal-header bg-info text-white"><h5 class="modal-title"><i class="fas fa-pen"></i> <span id="idMODBUSTitre"></span></h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
  <div class="modal-body">
   <div class="row mb-2 align-items-center"><label class="col-5 col-sm-4 col-form-label text-end">Serveur de l'agent</label><div class="col-7 col-sm-8"><select id="idTargetServer" class="form-select border-info"></select></div></div>
   <div class="row mb-2 align-items-center"><label class="col-5 col-sm-4 col-form-label text-end">TechID</label><div class="col-7 col-sm-8"><input id="idMODBUSTechID" required type="text" class="form-control" maxlength="32" placeholder="Tech ID du module"></div></div>
   <div class="row mb-2 align-items-center"><label class="col-5 col-sm-4 col-form-label text-end">Description</label><div class="col-7 col-sm-8"><input id="idMODBUSDescription" type="text" class="form-control" placeholder="Emplacement du module"></div></div>
   <div class="row mb-2 align-items-center"><label class="col-5 col-sm-4 col-form-label text-end">Hostname</label><div class="col-7 col-sm-8"><input id="idMODBUSHostname" required type="text" class="form-control" placeholder="IP ou hostname"></div></div>
   <div class="row mb-2 align-items-center"><label class="col-5 col-sm-4 col-form-label text-end">Watchdog</label><div class="col-7 col-sm-8"><div class="input-group"><input id="idMODBUSWatchdog" type="number" class="form-control" min="10" max="1200"><span class="input-group-text">1/10 secondes</span></div></div></div>
   <div class="row mb-2 align-items-center"><label class="col-5 col-sm-4 col-form-label text-end">Max requêtes/sec</label><div class="col-7 col-sm-8"><input id="idMODBUSMaxRequestParSec" type="number" class="form-control" min="1" max="100"></div></div>
  </div>
  <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal"><i class="fas fa-times"></i> Annuler</button><button id="idMODBUSValider" type="button" class="btn btn-primary"><i class="fas fa-save"></i> Valider</button></div>
 </div></div>
</div>
