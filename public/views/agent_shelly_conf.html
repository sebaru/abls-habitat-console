<div class="container-fluid">
  <div class="row m-2 align-items-center">
    <div class="col-auto">
      <h3 class="mb-0">Détail Shelly <span id="idSHELLYCONFTitle"></span></h3>
    </div>
    <div class="col-auto ms-auto btn-group align-items-center">
      <button type="button" onclick="Redirect('/agents/shelly')" class="btn btn-outline-secondary"><i class="fas fa-list"></i> Retour à la liste</button>
      <button type="button" onclick="SHELLYCONF_Refresh()" class="btn btn-outline-secondary"><i class="fas fa-redo"></i> Refresh</button>
    </div>
  </div>
  <hr>
  <div class="row g-2 m-1">
    <div class="col-12 col-md-4">
      <div class="card border-info">
        <div class="card-header">Serveur</div>
        <div class="card-body"><span id="idSHELLYCONFServer">-</span></div>
      </div>
    </div>
    <div class="col-12 col-md-4">
      <div class="card border-info">
        <div class="card-header">Statut</div>
        <div class="card-body"><span id="idSHELLYCONFStatus">-</span></div>
      </div>
    </div>
    <div class="col-12 col-md-4">
      <div class="card border-info">
        <div class="card-header">Activé</div>
        <div class="card-body"><span id="idSHELLYCONFEnabled">-</span></div>
      </div>
    </div>
    <div class="col-12 col-md-6">
      <div class="card border-info">
        <div class="card-header">Hostname</div>
        <div class="card-body"><span id="idSHELLYCONFHostname">-</span></div>
      </div>
    </div>
    <div class="col-12 col-md-6">
      <div class="card border-info">
        <div class="card-header">String ID</div>
        <div class="card-body"><span id="idSHELLYCONFStringID">-</span></div>
      </div>
    </div>
    <div class="col-12">
      <div class="card border-info">
        <div class="card-header">Description</div>
        <div class="card-body"><span id="idSHELLYCONFDescription">-</span></div>
      </div>
    </div>
  </div>
</div>
