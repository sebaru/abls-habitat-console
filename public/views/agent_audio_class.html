<!------------------------------------------------- Modal Edition configuration ----------------------------------------------->
<div id="idAUDIOEdit" class="modal fade" tabindex="-1" role="dialog">
  <div class="modal-dialog modal-dialog-centered modal-lg" role="document">
    <div class="modal-content ">
      <div class="modal-header bg-info text-white">
        <h5 class="modal-title"><i class="fas fa-pen"></i> <span id="idAUDIOEditTitre"></span></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close">
        </button>
      </div>

      <div class="modal-body">
       <div class="row mb-2 align-items-center">
         <label class="col-5 col-sm-4 col-form-label text-end">Serveur de l'agent</label>
         <div class="col-7 col-sm-8">
          <select id="idTargetServer" class="form-select border-info"></select>
         </div>
       </div>

       <div class="row mb-2 align-items-center">
         <label class="col-5 col-sm-4 col-form-label text-end">Description</label>
         <div class="col-7 col-sm-8">
          <input id="idAUDIODescription" type="text" class="form-control" placeholder="Description">
         </div>
       </div>

       <div class="row mb-2 align-items-center">
         <label class="col-5 col-sm-4 col-form-label text-end">Langue</label>
         <div class="col-7 col-sm-8">
          <input id="idAUDIOLanguage" type="text" class="form-control" placeholder="fr">
         </div>
       </div>

       <div class="row mb-2 align-items-center">
         <label class="col-5 col-sm-4 col-form-label text-end">Périphérique</label>
         <div class="col-7 col-sm-8">
          <input id="idAUDIODevice" type="text" class="form-control" placeholder="default">
         </div>
       </div>

       <div class="row mb-2 align-items-center">
         <label class="col-5 col-sm-4 col-form-label text-end">Volume</label>
         <div class="col-7 col-sm-8">
          <div class="input-group">
           <input id="idAUDIOVolume" required type="number" class="form-control" min=0 max=100 step=1 placeholder="Volume de diffusion">
           <span class="input-group-text">%</span>
          </div>
         </div>
       </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"><i class="fas fa-times"></i> Annuler</button>
        <button id="idAUDIOValider" type="button" class="btn btn-primary"><i class="fas fa-save"></i> Valider</button>
      </div>
    </div>
  </div>
</div>
