<div class="container-fluid">

 <div class="row m-2">
   <div class ="col-auto ms-auto btn-group align-items-center">
        <button type="button" onclick="SMSG_Add()" class="btn btn-primary"><i class="fas fa-plus"></i> Ajouter un GSM</button>
        <button type="button" onclick="SMSG_Refresh()" class="btn btn-outline-secondary"><i class="fas fa-redo"></i> Refresh</button>
        <!-- <button type="button" class="btn btn-sm btn-primary rounded-circle"><i class="fas fa-plus"></i></button>-->
   </div>
 </div>

<hr>

     <table id="idTableSMSG" class="table table-striped table-bordered table-hover">
       <thead class="table-dark">
       </thead>
       <tbody>
       </tbody>
     </table>

<!-- Container -->
</div>


<div id="idSMSGEdit" class="modal fade" tabindex="-1" role="dialog">
  <div class="modal-dialog modal-dialog-centered modal-lg" role="document">
    <div class="modal-content ">
      <div class="modal-header bg-info text-white">
        <h5 class="modal-title text-justify"><i class="fas fa-pen"></i> <span id="idSMSGTitre"></span></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close">
        </button>
      </div>
      <div class="modal-body">

       <div class="row mb-2 align-items-center">
         <label class="col-5 col-sm-4 col-form-label text-end">Choix de l'agent</label>
         <div class="col-7 col-sm-8">
           <select id="idTargetAgent" class="form-select border-info"></select>
         </div>
       </div>

       <div class="row mb-2 align-items-center">
         <label class="col-5 col-sm-4 col-form-label text-end">SMSG Tech_ID</label>
         <div class="col-7 col-sm-8">
           <input id="idSMSGTechID" type="text" class="form-control" maxlength="32" placeholder="Tech_ID du SMS">
         </div>
       </div>

       <div class="row mb-2 align-items-center">
         <label class="col-5 col-sm-4 col-form-label text-end">SMSG Description</label>
         <div class="col-7 col-sm-8">
           <input id="idSMSGDescription" type="text" class="form-control" placeholder="Description du téléphone et/ou sa position">
         </div>
       </div>

       <div class="row mb-2 align-items-center">
         <label class="col-5 col-sm-4 col-form-label text-end">OVH Service Name</label>
         <div class="col-7 col-sm-8">
           <div class="row g-2 align-items-center">
             <div class="col">
               <input id="idSMSGOVHServiceName" type="text" class="form-control" placeholder="OVH Service Name (sms-xxxxxx-1)">
             </div>
             <div class="col-12 col-sm-auto">
               <a target="_blank" href="https://eu.api.ovh.com/createToken/index.cgi?GET=/sms&GET=/sms/*/jobs&POST=/sms/*/jobs" class="btn btn-outline-info btn-sm">Creer un token</a>
             </div>
           </div>
         </div>
       </div>

       <div class="row mb-2 align-items-center">
         <label class="col-5 col-sm-4 col-form-label text-end">OVH Application Key</label>
         <div class="col-7 col-sm-8">
           <input id="idSMSGOVHApplicationKey" type="text" class="form-control" placeholder="OVH Application Key">
         </div>
       </div>

       <div class="row mb-2 align-items-center">
         <label class="col-5 col-sm-4 col-form-label text-end">OVH Application Secret</label>
         <div class="col-7 col-sm-8">
           <input id="idSMSGOVHApplicationSecret" type="text" class="form-control" placeholder="OVH Application Secret">
         </div>
       </div>

       <div class="row mb-2 align-items-center">
         <label class="col-5 col-sm-4 col-form-label text-end">OVH Consumer Key</label>
         <div class="col-7 col-sm-8">
           <input id="idSMSGOVHConsumerKey" type="text" class="form-control" placeholder="OVH Consumer Key">
         </div>
       </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"><i class="fas fa-times"></i> Annuler</button>
        <button id="idSMSGValider" type="button" class="btn btn-primary" data-bs-dismiss="modal"><i class="fas fa-save"></i> Valider</button>
      </div>
    </div>
  </div>
</div>
