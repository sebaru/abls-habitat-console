<div class="container-fluid">
  <div class="row m-2">
    <div class="col-auto ms-auto btn-group align-items-center">
      <button type="button" onclick="GPIOD_Add()" class="btn btn-primary"><i class="fas fa-plus"></i> Ajouter une connexion</button>
      <button type="button" onclick="GPIOD_Refresh()" class="btn btn-outline-secondary"><i class="fas fa-redo"></i> Refresh</button>
    </div>
  </div>
  <hr>
  <table id="idTableGPIOD" class="table table-striped table-bordered table-hover">
    <thead class="table-dark"></thead>
    <tbody></tbody>
  </table>
</div>

<div id="idGPIODEdit" class="modal fade" tabindex="-1" role="dialog">
  <div class="modal-dialog modal-dialog-centered modal-lg" role="document">
    <div class="modal-content">
      <div class="modal-header bg-info text-white">
        <h5 class="modal-title"><i class="fas fa-pen"></i> <span id="idGPIODTitre"></span></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="row mb-2 align-items-center">
          <label class="col-5 col-sm-4 col-form-label text-end">Serveur de l'agent</label>
          <div class="col-7 col-sm-8"><select id="idTargetServer" class="form-select border-info"></select></div>
        </div>
        <div class="row mb-2 align-items-center">
          <label class="col-5 col-sm-4 col-form-label text-end">TechID</label>
          <div class="col-7 col-sm-8"><input id="idGPIODTechID" required type="text" class="form-control" placeholder="Tech ID du module"></div>
        </div>
        <div class="row mb-2 align-items-center">
          <label class="col-5 col-sm-4 col-form-label text-end">Description</label>
          <div class="col-7 col-sm-8"><input id="idGPIODDescription" type="text" class="form-control" placeholder="Description"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"><i class="fas fa-times"></i> Annuler</button>
        <button id="idGPIODValider" type="button" class="btn btn-primary"><i class="fas fa-save"></i> Valider</button>
      </div>
    </div>
  </div>
</div>
<!-- GPIOD agent list and configuration modal -->
